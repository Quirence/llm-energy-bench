[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-energy-bench"
version = "0.1.0"
description = "Research CLI for measuring local LLM inference performance and GPU energy use."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.27",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_energy_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
