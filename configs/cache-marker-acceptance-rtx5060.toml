# Diagnostic acceptance for the Qwen tokenizer/cache-marker boundary.
# 6 prompts x 3 repetitions x 1 model = 18 measured requests.

[experiment]
id = "cache-marker-acceptance-v3"
host_id = "maibenben-x16c-rtx5060"
output_dir = "../experiments/runs"
repetitions = 3
warmup_requests = 4
order_seed = 42

[runtime]
ollama_url = "http://127.0.0.1:11434"
models = ["qwen3:4b-instruct-2507-q4_K_M"]
expected_version = "0.34.2"
expected_digests = { "qwen3:4b-instruct-2507-q4_K_M" = "0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0" }

[gpu]
index = 0
telemetry_interval_ms = 100

[prompts]
path = "../prompts/pilot-v1.jsonl"

[options]
num_ctx = 4096
num_gpu = 999
temperature = 0.0
seed = 42
num_predict = 256
kv_cache = "f16"
concurrency = 1
