# Generic one-model technical smoke config used by default `doctor`.
#
# This is not a host-specific publication config. Primary and observation data
# must use the committed GPU-specific configs; the two-host comparison uses
# configs/benchmark-v1.toml.
#
# 6 prompts x 3 repetitions x 1 model = 18 measured requests.

[experiment]
id = "pilot-rtx3050"
host_id = "host-pilot"
output_dir = "../experiments/runs"
repetitions = 3
warmup_requests = 4
# Seeds the deterministic shuffle of the measured request order.
order_seed = 42

[runtime]
ollama_url = "http://127.0.0.1:11434"
models = ["llama3.2:3b-instruct-q4_K_M"]
expected_version = "0.34.2"
expected_digests = { "llama3.2:3b-instruct-q4_K_M" = "a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72" }

[gpu]
index = 0
telemetry_interval_ms = 100

[prompts]
path = "../prompts/pilot-v1.jsonl"

[options]
num_ctx = 4096
# Ollama treats this as the requested number of GPU layers. A deliberately
# high value forces all available model layers onto one GPU; preflight rejects
# the run instead of silently accepting CPU offload when that cannot fit.
num_gpu = 999
temperature = 0.0
# Seeds Ollama sampling; unrelated to order_seed above.
seed = 42
num_predict = 256
kv_cache = "f16"
concurrency = 1

# No [cost] section: without an explicit tariff and currency every cost field
# stays null rather than being invented from a default electricity price.
