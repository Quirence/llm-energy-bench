name: Bug report
description: Report a reproducible defect in the CLI, measurement, or artifacts.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the command, exit code, and the smallest safe error excerpt.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Reproduction context
      description: GPU, driver, OS, Python, Ollama version, model tag/digest, and config hash.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed usernames, home paths, raw GPU UUIDs, tokens, and other secrets.
          required: true
